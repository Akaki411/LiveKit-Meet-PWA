configs:
  livekit_config:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 60100
        use_external_ip: true
      redis:
        address: ${REDIS_ADDRESS:-localhost:6379}
      keys:
        ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?copy .env.example to .env and set LIVEKIT_API_SECRET}
      webhook:
        api_key: ${LIVEKIT_API_KEY:-devkey}
        urls:
          - http://localhost:3000/api/livekit-webhook

services:
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml

  web:
    image: ${WEB_IMAGE:-livekit-meet-auth:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SHOW_SETTINGS_MENU: ${NEXT_PUBLIC_SHOW_SETTINGS_MENU:-true}
        NEXT_PUBLIC_LK_RECORD_ENDPOINT: ${NEXT_PUBLIC_LK_RECORD_ENDPOINT:-/api/record}
    container_name: livekit-meet-auth
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    depends_on:
      - livekit
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./recordings:/app/recordings

  egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: unless-stopped
    network_mode: host
    profiles: ["recording"]
    cap_add:
      - CAP_SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:?copy .env.example to .env and set LIVEKIT_API_SECRET}
        ws_url: ws://localhost:7880
        insecure: true
        redis:
          address: ${REDIS_ADDRESS:-localhost:6379}
    depends_on:
      - redis
      - livekit
    volumes:
      - ./recordings:/out

  vad:
    image: ${VAD_IMAGE:-livekit-vad:local}
    container_name: livekit-vad
    restart: unless-stopped
    network_mode: host
    profiles: ["vad"]
    depends_on:
      - livekit
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?copy .env.example to .env and set LIVEKIT_API_SECRET}
